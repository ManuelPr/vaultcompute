[project]
name = "vaultcompute"
version = "0.1.0"
description = "Controlled computation over private data for LLM applications."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Manuel Pernigotto" }]
keywords = ["llm", "mcp", "privacy", "tokenization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0,<2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ManuelPr/vaultcompute"
Repository = "https://github.com/ManuelPr/vaultcompute"
Issues = "https://github.com/ManuelPr/vaultcompute/issues"
Changelog = "https://github.com/ManuelPr/vaultcompute/blob/main/CHANGELOG.md"

[project.optional-dependencies]
demo = [
    "anthropic>=0.30",
]
encryption = [
    "cryptography>=42",
]

[project.scripts]
vaultcompute = "vaultcompute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultcompute"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
