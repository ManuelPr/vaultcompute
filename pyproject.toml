[project]
name = "vaultcompute"
version = "0.1.0a1"
description = "Controlled computation over private data for LLM applications."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manuel Pernigotto" }]
keywords = ["llm", "mcp", "privacy", "tokenization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0,<2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ManuelPr/vaultcompute"
Repository = "https://github.com/ManuelPr/vaultcompute"
Issues = "https://github.com/ManuelPr/vaultcompute/issues"
Changelog = "https://github.com/ManuelPr/vaultcompute/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ManuelPr/vaultcompute/blob/main/docs/api.md"

[project.optional-dependencies]
demo = [
    "anthropic>=0.30",
]
encryption = [
    "cryptography>=42",
]

[project.scripts]
vaultcompute = "vaultcompute.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultcompute"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "/src/vaultcompute",
    "/tests",
    "/examples",
    "/scripts",
    "/docs",
    "/plugin",
    "/plugins",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
    "/uv.lock",
    "/vaultcompute.example.yaml",
]
exclude = ["/docs/archive", "**/__pycache__", "**/*.pyc"]

# These tracked plugin files are intentionally exceptions to the local-secret
# .mcp.json ignore rule; the repository's root .mcp.json must never ship.
[tool.hatch.build.targets.sdist.force-include]
"plugin/.mcp.json" = "plugin/.mcp.json"
"plugins/vaultcompute-codex/.mcp.json" = "plugins/vaultcompute-codex/.mcp.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
