name: Package validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.11"
      - run: uv build --no-sources --out-dir dist/release
      - name: Check release contents and metadata
        run: uv run --no-project python scripts/verify_package.py dist/release
      - name: Validate package description
        run: uvx --from 'twine>=6.1,<7' twine check --strict dist/release/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vaultcompute-dist
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: vaultcompute-dist
          path: dist/release
      - name: Exercise clean wheel and source installs
        run: uv run --no-project python scripts/verify_package.py dist/release --install
