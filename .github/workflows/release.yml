name: Release

# Deliberately manual. Select the immutable version tag as the workflow ref.
# No publish occurs on a branch push, PR, or GitHub release draft.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Publish the verified tag to this registry
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.11"
      - name: Require a tag matching the package version
        run: |
          uv run --no-project python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert os.environ['GITHUB_REF_TYPE'] == 'tag', 'Run this workflow on a version tag'; assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package version differ'"

  source-tests:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  packages:
    needs: validate-tag
    uses: ./.github/workflows/package.yml

  publish-testpypi:
    if: inputs.registry == 'testpypi'
    needs: [source-tests, packages]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/vaultcompute/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: vaultcompute-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  check-testpypi:
    if: inputs.registry == 'testpypi'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.11"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: vaultcompute-dist
          path: dist/release
      - run: uv run --no-project python scripts/verify_testpypi.py dist/release --install

  publish-pypi:
    if: inputs.registry == 'pypi'
    needs: [source-tests, packages]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vaultcompute/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.28"
          python-version: "3.11"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: vaultcompute-dist
          path: dist/release
      - name: Require the identical distributions to be installable from TestPyPI
        run: uv run --no-project python scripts/verify_testpypi.py dist/release --install
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/release/
